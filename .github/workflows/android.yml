name: Android APK

on:
  push:
    paths:
      - "reader/**"
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    env:
      MARGINALIA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync Android project
        run: npm run sync

      - name: Decode release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.MARGINALIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marginalia-release.p12"
            echo "MARGINALIA_KEYSTORE_PATH=$RUNNER_TEMP/marginalia-release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.key.outputs.signed == 'true'
        working-directory: android-app/android
        env:
          MARGINALIA_KEYSTORE_PASSWORD: ${{ secrets.MARGINALIA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/marginalia-1.0.${MARGINALIA_VERSION_CODE}.apk"

      - name: Build test APK (no signing secrets yet)
        if: steps.key.outputs.signed != 'true'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk "../out/marginalia-test-1.0.${MARGINALIA_VERSION_CODE}.apk"
          {
            echo "### Test build"
            echo "Signing secrets are not set, so this APK is signed with a throwaway key."
            echo "It cannot install over a previous build; uninstalling first deletes your library."
            echo "Add MARGINALIA_KEYSTORE_BASE64 and MARGINALIA_KEYSTORE_PASSWORD to get release builds that update in place."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marginalia-apk-${{ github.run_number }}
          path: android-app/out/*.apk
          if-no-files-found: error
          retention-days: 30
